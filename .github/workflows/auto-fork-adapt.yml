name: Auto Fork & Adapt PR

on:
  # 手动触发：全流程自动
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: '上游仓库 (owner/repo)'
        required: true
        default: 'hootandy321/dsh-Agentlink'
      target_branch:
        description: '适配分支名称'
        required: true
        default: 'zcode-adaptation'
      version:
        description: '版本号'
        required: false
        default: '0.1.0'
      
  # 定时检查 PR 合并状态
  schedule:
    - cron: '0 */6 * * *'

env:
  # 必须在仓库 Settings → Secrets 添加 PAT_TOKEN
  # PAT 权限需要: public_repo (公开仓库) 或 repo (私有仓库)

jobs:
  auto-fork:
    runs-on: ubuntu-latest
    outputs:
      fork_repo: ${{ steps.check.outputs.fork_repo }}
      fork_exists: ${{ steps.check.outputs.fork_exists }}
    steps:
      - name: Check or create fork
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const upstreamRepo = '${{ github.event.inputs.upstream_repo }}';
            const token = process.env.PAT_TOKEN;
            const [owner, name] = upstreamRepo.split('/');
            const myOwner = context.repo.owner;
            
            const headers = { Authorization: `token ${token}` };
            
            // 检查是否已有 fork
            try {
              const { data: fork } = await fetch(
                `https://api.github.com/repos/${myOwner}/${name}`,
                { headers }
              ).then(r => r.json());
              
              console.log(`Fork 已存在: ${fork.html_url}`);
              core.setOutput('fork_repo', `${myOwner}/${name}`);
              core.setOutput('fork_exists', 'true');
            } catch (error) {
              // 创建 fork
              console.log('创建新 fork...');
              const response = await fetch(
                `https://api.github.com/repos/forks`,
                {
                  method: 'POST',
                  headers: { ...headers, 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    owner: owner,
                    repo: name,
                    organization: undefined
                  })
                }
              );
              
              if (response.ok) {
                const fork = await response.json();
                console.log(`Fork 创建成功: ${fork.html_url}`);
                core.setOutput('fork_repo', `${myOwner}/${name}`);
                core.setOutput('fork_exists', 'true');
              } else {
                const err = await response.text();
                core.setFailed(`创建 fork 失败: ${err}`);
                core.setOutput('fork_exists', 'false');
              }
            }

  adapt-and-create-pr:
    needs: auto-fork
    if: needs.auto-fork.outputs.fork_exists == 'true'
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.pr.outputs.number }}
      pr_url: ${{ steps.pr.outputs.url }}
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.auto-fork.outputs.fork_repo }}
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: main

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/${{ github.event.inputs.upstream_repo }}.git
          git fetch upstream main

      - name: Apply adaptations
        run: |
          echo "🎯 开始 ZCode 适配..."
          
          # 创建 ZCode 插件目录和配置
          mkdir -p .zcode-plugin
          cat > .zcode-plugin/plugin.json << 'EOF'
          {
            "name": "dsh-agentlink-zcode",
            "description": "DSH MCP bridge with ZCode support",
            "version": "${{ github.event.inputs.version }}",
            "mcp": {
              "servers": {
                "dsh_agentlink": {
                  "command": "node",
                  "args": ["${pluginDir}/dist/index.js"],
                  "cwd": "${ZCODE_PROJECT_DIR}",
                  "env": {
                    "DSH_HOST_URL": "http://127.0.0.1:3080",
                    "DSH_BRIDGE_AGENT_PRESET": "code"
                  }
                }
              }
            },
            "skills": ["dsh-collab"]
          }
          EOF
          
          # 创建协作技能文件
          mkdir -p skills/dsh-collab
          echo "# dsh-collab Skill

## 简介
dsh-collab 是 ZCode 专用的 DSH 协作技能

## 工具列表
- \`mcp__dsh_agentlink__dsh_delegate\` — 委派任务给 DSH
- \`mcp__dsh_agentlink__dsh_wait\` — 等待 DSH 完成
- \`mcp__dsh_agentlink__dsh_tail\` — 查看进度
- \`mcp__dsh_agentlink__dsh_cancel\` — 取消任务

## 使用示例
使用 mcp__dsh_agentlink__dsh_delegate 将任务委派给 DSH
" > skills/dsh-collab/SKILL.md
          
          # 追加适配说明到 README
          if [ -f "README.md" ]; then
            echo "" >> README.md
            cat >> README.md << 'README_EOF'

---

## ZCode 适配

**本仓库是 \`hootandy321/dsh-Agentlink\` 的二次开发版，添加了 ZCode 插件支持。**

### 新增特性
- ZCode 插件配置 (\`.zcode-plugin/plugin.json\`)
- 协作技能 (skills/dsh-collab/)
- 安装脚本 (scripts/install.ps1)
- 自动同步机制 (.github/workflows/sync-upstream.yml)

README_EOF
          fi

          git add -A
          git commit -m "feat: ZCode adaptation v${{ github.event.inputs.version }}" || echo "无变更"
          git push origin main || echo "推送失败"

      - name: Create Pull Request
        id: pr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.event.inputs.target_branch }}
          title: 'ZCode adaptation'
          body: |
            ## ZCode 适配
            
            为项目添加 ZCode 插件支持。
            
            ### 变更
            - .zcode-plugin/plugin.json
            - skills/dsh-collab/SKILL.md  
            - scripts/install.ps1
            - README.md (适配说明)
            
            请合并后我的 fork 将自动同步。
          labels: |
            zcode
            enhancement
          draft: false

  check-pr-status:
    needs: adapt-and-create-pr
    if: always() && needs.adapt-and-create-pr.outputs.pr_number != ''
    runs-on: ubuntu-latest
    steps:
      - name: Check PR status
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = ${{ needs.adapt-and-create-pr.outputs.pr_number }};
            const [owner, repo] = '${{ github.event.inputs.upstream_repo }}'.split('/');
            
            for (let i = 0; i < 30; i++) {  // 最多等 25 分钟
              await new Promise(r => setTimeout(r, 30000));
              
              try {
                const { data: pr } = await github.rest.pulls.get({
                  owner, repo, pull_number: parseInt(prNumber)
                });
                console.log(`PR 状态: ${pr.state}, merged: ${pr.merged}`);
                
                if (pr.merged) {
                  core.setOutput('merged', 'true');
                  process.exit(0);
                }
              } catch (e) {
                console.log(`等待 PR 合并... (${i+1}/30)`);
              }
            }
            core.setOutput('merged', 'false');

  sync-merged:
    needs: [auto-fork, check-pr-status]
    if: needs.check-pr-status.outputs.merged == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout my fork
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync merged changes
        run: |
          git fetch origin main
          git merge origin/main --no-ff -m "chore: sync upstream main"
          git push origin main

      - name: Create Release
        if: env.GITHUB_TOKEN != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 'v${{ github.event.inputs.version }}'
          name: 'ZCode v${{ github.event.inputs.version}}'
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}