name: Auto Fork & Sync

on:
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: '上游仓库 (例如: hootandy321/dsh-Agentlink)'
        required: true
      branch_name:
        description: '适配分支名称'
        required: true
        default: 'zcode-adaptation'
      version:
        description: '版本号'
        required: true
        default: '0.1.0-alpha.1'
  schedule:
    - cron: '0 */12 * * *'  # 每 12 小时检查一次 PR 状态

permissions:
  contents: write
  pull-requests: write
  id-token: write
  repository-projects: write
  statuses: write

jobs:
  check-fork:
    runs-on: ubuntu-latest
    outputs:
      fork_exists: ${{ steps.check.outputs.fork_exists }}
      fork_url: ${{ steps.check.outputs.fork_url }}
    steps:
      - name: Check if fork exists
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const upstreamRepo = '${{ github.event.inputs.upstream_repo || 'hootandy321/dsh-Agentlink' }}';
            const owner = context.repo.owner;
            
            try {
              // 尝试获取 fork
              const fork = await github.rest.repos.get({
                owner: owner,
                repo: upstreamRepo.split('/')[1]
              });
              
              const forkUrl = `https://github.com/${owner}/${fork.data.name}`;
              core.setOutput('fork_exists', 'true');
              core.setOutput('fork_url', forkUrl);
            } catch (error) {
              core.setOutput('fork_exists', 'false');
              core.setOutput('fork_url', `https://github.com/${owner}/${upstreamRepo.split('/')[1]}`);
            }

  create-fork:
    needs: check-fork
    if: needs.check-fork.outputs.fork_exists == 'false'
    runs-on: ubuntu-latest
    outputs:
      fork_url: ${{ steps.fork.outputs.html_url }}
    steps:
      - name: Create fork
        uses: actions/github-script@v7
        id: fork
        with:
          script: |
            const upstreamRepo = '${{ github.event.inputs.upstream_repo }}';
            const owner = context.repo.owner;
            
            const { data: fork } = await github.rest.repos.createFork({
              owner: upstreamRepo.split('/')[0],
              repo: upstreamRepo.split('/')[1],
              organization: undefined,
              name: undefined
            });
            
            await github.rest.repos.createFile({
              owner: owner,
              repo: fork.name,
              path: 'fork-visited.md',
              message: 'docs: mark fork as visited for ZCode adaptation',
              content: Buffer.from('# 已访问此 fork 用于 ZCode 适配\n\n此仓库是对 [${upstreamRepo}](https://github.com/${upstreamRepo}) 的二次开发版本，添加了 ZCode 插件支持。\n').toString('base64')
            });
            
            core.setOutput('fork_url', fork.html_url);

  sync-and-adapt:
    needs: [check-fork, create-fork]
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.pr.outputs.number }}
    steps:
      - name: Checkout upstream
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.upstream_repo }}
          ref: main
          path: upstream

      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.check-fork.outputs.fork_url }}
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Apply adaptations
        run: |
          # 这里放置您的适配逻辑
          # 例如：复制 ZCode 插件文件、修改配置等
          echo "Applying adaptations..."
          
      - name: Create new branch
        run: |
          BRANCH_NAME="${{ github.event.inputs.branch_name }}"
          git checkout -b "$BRANCH_NAME"
          git add -A
          git commit -m "feat: ZCode adaptation support" || echo "No changes to commit"
          git push origin "$BRANCH_NAME"

      - name: Create PR
        uses: peter-evans/create-pull-request@v6
        id: pr
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          owner: ${{ github.event.inputs.upstream_repo.split('/')[0] }}
          repo: ${{ github.event.inputs.upstream_repo.split('/')[1] }}
          branch: ${{ github.event.inputs.branch_name }}
          title: 'ZCode adaptation support'
          body: |
            ## ZCode 适配
            
            添加 ZCode 插件支持，让该项目可在 ZCode 环境中使用。
            
            ### 新增内容
            - `.zcode-plugin/plugin.json` — ZCode 插件配置
            - `skills/dsh-collab/SKILL.md` — ZCode 协作技能
            - `scripts/install.ps1` — 一键安装脚本
            - `.github/workflows/sync-upstream.yml` — 自动同步机制
            
            ### 自动同步
            此 PR 合入后，fork 将自动同步上游更新。
          labels: |
            zcode
            enhancement
          draft: false

  check-pr-status:
    needs: sync-and-adapt
    runs-on: ubuntu-latest
    if: needs.sync-and-adapt.outputs.pr_number != ''
    steps:
      - name: Check PR status
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = ${{ needs.sync-and-adapt.outputs.pr_number }};
            const { data: pr } = await github.rest.pulls.get({
              owner: '${{ github.event.inputs.upstream_repo.split('/')[0] }}',
              repo: '${{ github.event.inputs.upstream_repo.split('/')[1] }}',
              pull_number: prNumber
            });
            
            core.setOutput('state', pr.state);
            core.setOutput('merged', pr.merged);

  sync-if-merged:
    needs: check-pr-status
    if: needs.check-pr-status.outputs.merged == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Sync merged changes to main
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Merge PR changes
        run: |
          # 从 PR 中下载补丁
          PR_SHA="${{ needs.sync-and-adapt.outputs.pr_number }}"
          curl -sSL "https://api.github.com/repos/${{ github.event.inputs.upstream_repo }}/pulls/$PR_SHA/commits" | jq -r '.[].sha' | while read COMMIT; do
            git cherry-pick "$COMMIT" || true
          done
          
          git push origin main